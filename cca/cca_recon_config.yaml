processor-toolbox:

    processors:

        - type: egg-processor
          name: egg1
        - type: forward-fftw
          name: fft1
        - type: convert-to-power
          name: to-ps1

        - type: egg-processor
          name: egg2
        - type: forward-fftw
          name: fft2
        - type: convert-to-power
          name: to-ps2

        - type: data-accumulator
          name: acc
        - type: gain-variation
          name: gainvar

        - type: variable-spectrum-discriminator
          name: discrim
        - type: sequential-track-finder
          name: seq-tr-clust
        - type: overlapping-track-clustering
          name: otc
        - type: iterative-track-clustering
          name: itc
        - type: track-proc-ws
          name: tr-proc-ws
        # - type: mpt-processing
        #   name: mpt-sb-proc
        # - type: cavity-mpt-processing
        #   name: cavity-mpt-proc
        - type: multi-peak-track-builder
          name: mptb
        - type: multi-peak-event-builder
          name: mpeb
        - type: cavity-event-processing
          name: cavity-event-proc

        - type: apply-cut
          name: ac1b

        - type: basic-root-writer
          name: brw
        - type: root-tree-writer
          name: trw
        - type: root-spectrogram-writer
          name: waterfall-writer

    connections:

        # Header processing
        - signal: "egg1:header"
          slot: "fft1:header"

        - signal: "egg1:ts"
          slot: "fft1:ts-fftw"

        # First egg processing
        - signal: "fft1:fft"
          slot: "to-ps1:fs-fftw-to-psd"

        - signal: "to-ps1:psd"
          slot: "acc:ps"

        - signal: "acc:ps-finished"
          slot: "gainvar:ps-var"

        - signal: "acc:ps-finished"
          slot: "brw:psd"                 # Write accumulated PSD histogram

        - signal: "gainvar:gain-var"
          slot: "brw:gain-var"            # Write gain-var histogram

        - signal: "gainvar:gain-var"
          slot: "discrim:gv"

        # Second egg processing
        - signal: "egg2:header"
          slot: "fft2:header"

        - signal: "egg2:ts"
          slot: "fft2:ts-fftw"

        - signal: "fft2:fft"
          slot: "to-ps2:fs-fftw-to-psd"

        - signal: "to-ps2:psd"
          slot: "waterfall-writer:psd"

        - signal: "egg2:egg-done"
          slot: "waterfall-writer:write-file"

        - signal: "to-ps2:psd"
          slot: "discrim:ps-pre"

        - signal: "discrim:disc-1d"
          slot: "seq-tr-clust:disc-1d"

        - signal: "discrim:disc-1d"
          slot: "trw:disc-1d"             # Writing discriminated points to ROOT tree

        - signal: "seq-tr-clust:seq-cand"
          slot: "otc:seq-cand"

        - signal: "otc:seq-cand"
          slot: "itc:seq-cand"

        - signal: "itc:seq-cand"
          slot: "ac1b:apply"

        - signal: "ac1b:pass"
          slot: "tr-proc-ws:seq-cand"

        - signal: "tr-proc-ws:track"
          slot: "mptb:track"

        - signal: "tr-proc-ws:track"      
          slot: "trw:proc-track"          # Write processed tracks to a ROOT tree

        - signal: "egg2:egg-done"
          slot: "seq-tr-clust:done"

        - signal: "seq-tr-clust:clustering-done"
          slot: "otc:do-clustering"

        - signal: "otc:clustering-done"
          slot: "itc:do-clustering"

        - signal: "itc:clustering-done"
          slot: "mptb:do-clustering"

        # - signal: "mptb:mpt"
        #   slot: "cavity-mpt-proc:mpt"

        # - signal: "cavity-mpt-proc:proc-cavity-mpt"
        #   slot: "trw:processed-cavity-mpt"

        # - signal: "mptb:mpt"
        #   slot: "mpt-sb-proc:mpt"

        # - signal: "mpt-sb-proc:proc-mpt"
        #   slot: "trw:processed-mpt"

        - signal: "mptb:mpt"
          slot: "mpeb:mpt"

        - signal: "mptb:mpt"
          slot: "trw:mp-track"

        - signal: "mptb:mpt-done"
          slot: "mpeb:do-clustering"

        - signal: "mpeb:event"
          slot: "trw:mt-event"

        - signal: "mpeb:event"
          slot: "cavity-event-proc:mt-event"

        - signal: "cavity-event-proc:proc-cavity-event"
          slot: "trw:processed-cavity-event"


    run-queue:
        - egg1
        - egg2


egg1:
    filename: "locust_mc_Seed600_Angle88.0000000_Pos0.0000000_Energy18500.000000.egg"
    egg-reader: egg3
    number-of-slices: 400
    slice-size: 8192

fft1:
    transform-flag: ESTIMATE

acc:
    number-to-average: 0
    signal-interval: 0

gainvar:
    normalize: false
    min-frequency: 0
    max-frequency: 403.e6
    fit-points: 300

egg2:
    filename: "$eggfilename"
    egg-reader: egg3
    number-of-slices: 400
    slice-size: 8192

fft2:
    transform-flag: ESTIMATE

waterfall-writer:
    output-file: "$spectrogramfilename"
    file-flag: recreate
    min-time: 0.0
    max-time: 0.008
    min-freq: 0.0e6
    max-freq: 403.0e6

discrim:
    min-frequency: 50.e6         # Here we chop the frequency range to (100 +/-
    max-frequency: 200.e6        # 42.5) MHz, the active bandwidth of the RSA
    # snr-threshold-power: 6.0
    sigma-threshold: 9.0
    normalize: true
    neighborhood-radius: 2.

seq-tr-clust:
    min-frequency: 3.e6
    max-frequency: 400.e6
    initial-slope : 0.3e9                # slope of a track with 1 point
    slope-method: weighted-first-point-ref
    n-slope-points: 10
    time-gap-tolerance: 0.1e-3
    frequency-acceptance: 56e3
    trimming-threshold: 6.0            # snr threshold for the first and last point of a candidate
    min-points: 3
    min-slope: 0

otc:
    max-track-width: 150e3          # For most tracks this only needs to be 150e3-ish. Only curved tracks profit from this number being bigger

itc:
    time-gap-tolerance: 1.0e-3
    frequency-acceptance: 100.0e3
    max-track-width: 100.0e3

tr-proc-ws:
    min-slope: 10.0e6

mptb:
    sideband-time-tol: 1e-3

mpeb:
    jump-time-tol: 3.0e-3

cavity-event-proc:
    3band-class-rel-power-thresh: 0.7

ac1b:
    seq-line-nup-cut:               # can be applied after stf, after otc or after itc
        min-total-nup: 0.0
        min-average-nup: 7.0
        time-or-bin-average: bin
        wide-or-narrow: wide        # wide is default

brw:
    output-file: "$katydidbasicfilename"
    file-flag: recreate

trw:
    output-file: "$katydidoutputfilename"
    file-flag: recreate
    
