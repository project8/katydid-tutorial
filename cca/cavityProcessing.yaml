processor-toolbox:
    processors:
      - type: egg-processor
        name: egg1
      - type: forward-fftw
        name: fft1
      - type: convert-to-power
        name: to-ps1

      - type: egg-processor 
        name: egg2
      - type: forward-fftw
        name: fft2
      - type: convert-to-power
        name: to-ps2

      - type: data-accumulator
        name: acc
      - type: gain-variation
        name: gainvar

      - type: variable-spectrum-discriminator
        name: discrim
      - type: sequential-track-finder
        name: seq-tr-clust
      - type: overlapping-track-clustering
        name: otc
      - type: iterative-track-clustering
        name: itc
      - type: track-proc-ws
        name: tr-proc-ws
      - type: multi-peak-track-builder
        name: mptb
      - type: multi-peak-event-builder
        name: mpeb
      - type: cavity-event-processing
        name: cavity-event-proc

      

      - type: apply-cut
        name: ac1b
      - type: apply-cut
        name: event-nup-cut
      - type: apply-cut
        name: event-time-cut

      - type: basic-root-writer
        name: writer
      - type: root-tree-writer
        name: treewriter
      - type: root-spectrogram-writer
        name: specwriter

    connections:
      # This code block is for processing the noise-only data to remove the frequency dependent bkg
      - signal: "egg1:header"
        slot: "fft1:header"
      - signal: "egg1:ts"
        slot: "fft1:ts-fftw"
      - signal: "fft1:fft"
        slot: "to-ps1:fs-fftw-to-psd"
      - signal: "to-ps1:psd"
        slot: "acc:ps"
      - signal: "acc:ps-finished"
        slot: "gainvar:ps-var"
      - signal: "acc:ps-finished"
        slot: "writer:psd"                 # Write accumulated PSD histogram
      - signal: "gainvar:gain-var"
        slot: "writer:gain-var"            # Write gain-var histogram
      - signal: "gainvar:gain-var"
        slot: "discrim:gv"
        
      # This code block is for processing the signal data, there is a connection to the above block via discrim processor
      - signal: "egg2:header"
        slot: "fft2:header"
      - signal: "egg2:ts"
        slot: "fft2:ts-fftw"
      - signal: "fft2:fft"
        slot: "to-ps2:fs-fftw-to-psd"
      # - signal: "to-ps2:psd"               
      #   slot: "writer:ps"                 # Write signal PSD for each time slice
      # - signal: "egg2:ts"               
      #   slot: "writer:ts"               # Write signal time-series for each slice
      - signal: "to-ps2:psd"
        slot: "discrim:ps-pre"
      # - signal: "to-ps2:psd"
      #   slot: "specwriter:psd"
      # - signal: "egg2:egg-done"
      #   slot: "specwriter:write-file"     # Write spectrogram
      - signal: "discrim:disc-1d"
        slot: "treewriter:disc-1d"        # Write spare spectrogram bins
      - signal: "discrim:disc-1d"
        slot: "seq-tr-clust:disc-1d"       # Beginning track finding algorithm
      - signal: "seq-tr-clust:seq-cand"
        slot: "otc:seq-cand"
      - signal: "otc:seq-cand"
        slot: "itc:seq-cand"
      - signal: "itc:seq-cand"
        slot: "ac1b:apply"
      - signal: "ac1b:pass"
        slot: "tr-proc-ws:seq-cand"
      - signal: "egg2:egg-done"
        slot: "seq-tr-clust:done"
      - signal: "seq-tr-clust:clustering-done"
        slot: "otc:do-clustering"
      - signal: "otc:clustering-done"
        slot: "itc:do-clustering"
      # - signal: "tr-proc-ws:track"      
      #   slot: "treewriter:proc-track"          # Write processed tracks to a ROOT tree
      - signal: "tr-proc-ws:track"
        slot: "mptb:track"
      - signal: "itc:clustering-done"
        slot: "mptb:do-clustering"
      - signal: "mptb:mpt"
        slot: "mpeb:mpt"
      - signal: "mptb:mpt-done"
        slot: "mpeb:do-clustering"
      - signal: "mpeb:event"
        slot: "cavity-event-proc:mt-event"
      - signal: "mpeb:event"
        slot: "event-nup-cut:apply"
      - signal: "event-nup-cut:pass"
        slot: "event-time-cut:apply"
      - signal: "event-time-cut:pass"
        slot: "treewriter:mt-event"              # Write processed multi-peak-track events


    run-queue:
      - egg1
      - egg2

egg1:
    filename: "noise.egg"
    egg-reader: egg3
    slice-size: 8192
    number-of-slices: 400 

fft1:
    transform-flag: ESTIMATE

acc:
    number-to-average: 0
    signal-interval: 0

gainvar: 
    normalize: false
    min-frequency: 0
    max-frequency: 403.e6
    fit-points: 300

egg2:
    filename: "$eggfilename"
    egg-reader: egg3
    number-of-slices: 400
    slice-size: 8192

fft2:
    transform-flag: ESTIMATE

discrim:
    min-frequency: 80.e6         # Here we chop the frequency range around the cavity resonance
    max-frequency: 200.e6        
    # snr-threshold-power: 6.0
    sigma-threshold: 9.0
    normalize: true
    neighborhood-radius: 2.

seq-tr-clust:
    min-frequency: 3.e6
    max-frequency: 400.e6
    initial-slope : 0.3e9                # slope of a track with 1 point
    slope-method: weighted-first-point-ref
    n-slope-points: 10
    time-gap-tolerance: 0.1e-3
    frequency-acceptance: 56e3
    trimming-threshold: 6.0            # snr threshold for the first and last point of a candidate
    min-points: 3
    min-slope: 0

otc:
    max-track-width: 150e3          # For most tracks this only needs to be 150e3-ish. Only curved tracks profit from this number being bigger

itc:
    time-gap-tolerance: 1.0e-3
    frequency-acceptance: 100.0e3
    max-track-width: 100.0e3

tr-proc-ws:
    min-slope: 10.0e6

ac1b:
    seq-line-nup-cut:               # can be applied after stf, after otc or after itc
        min-total-nup: 0.0
        min-average-nup: 7.0
        time-or-bin-average: bin
        wide-or-narrow: wide        # wide is default

mptb:
    sideband-time-tol: 1e-3

mpeb:
    jump-time-tol: 3.0e-3

event-nup-cut:
    ntracks-npoints-nup-cut:      # cut events if the summed or average nup is below threshold
        wide-or-narrow: wide        # wide is default
